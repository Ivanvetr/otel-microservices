global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Métricas internas del Collector (CPU, memoria, spans/logs/métricas rechazados)
  - job_name: "otel-collector-internal"
    static_configs:
      - targets: ["otel-collector:8888"]

  # Métricas de negocio/aplicación reenviadas por service-a y service-b vía OTLP
  # y re-expuestas por el Collector en formato Prometheus.
  - job_name: "otel-collector-app-metrics"
    static_configs:
      - targets: ["otel-collector:8889"]
