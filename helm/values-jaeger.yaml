# values.yaml para el chart jaegertracing/jaeger
# Referencia: https://github.com/jaegertracing/helm-charts

provisionDataStore:
  cassandra: false
  elasticsearch: false

storage:
  type: badger
  badger:
    persistence:
      enabled: true
      size: 10Gi

allInOne:
  enabled: true
  replicas: 1
  extraEnv:
    - name: COLLECTOR_OTLP_ENABLED
      value: "true"
  ports:
    - name: otlp-grpc
      containerPort: 4317
      protocol: TCP
    - name: otlp-http
      containerPort: 4318
      protocol: TCP
    - name: query
      containerPort: 16686
      protocol: TCP
  service:
    type: LoadBalancer

collector:
  enabled: false
query:
  enabled: false
agent:
  enabled: false
